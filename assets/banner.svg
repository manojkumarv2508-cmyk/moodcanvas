<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#2d323f"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#dotgrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#2d323f" stroke-width="1"/>

  <!-- Accent Top Border -->
  <path d="M 0 16 A 16 16 0 0 1 16 0 L 1184 0 A 16 16 0 0 1 1200 16 L 1200 20 L 0 20 Z" fill="url(#accent)"/>

  <!-- Logo Icon -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="18" fill="#1e222d" stroke="#373e4d" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="8" fill="#6C5CE7"/>
    <circle cx="48" cy="30" r="6" fill="#00CEC9"/>
    <circle cx="42" cy="48" r="9" fill="#FFA500"/>
    <circle cx="25" cy="46" r="5" fill="#FF5E3A"/>
  </g>

  <!-- Title & Typography -->
  <text x="176" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">MoodCanvas</text>
  <text x="460" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500">/ visual whiteboard</text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="400">
    Infinite-canvas creative workspace for spatial reference curation, cross-tab ingestion, and node-connected thinking.
  </text>

  <!-- Badges row -->
  <g transform="translate(80, 240)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="28" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Zero Dependencies</text>

    <!-- Badge 2 -->
    <rect x="142" y="0" width="138" height="32" rx="6" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
    <circle cx="158" cy="16" r="4" fill="#3B82F6"/>
    <text x="170" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">100% Client-Side</text>

    <!-- Badge 3 -->
    <rect x="292" y="0" width="150" height="32" rx="6" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
    <circle cx="308" cy="16" r="4" fill="#F59E0B"/>
    <text x="320" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Cross-Tab Ingestion</text>

    <!-- Badge 4 -->
    <rect x="454" y="0" width="128" height="32" rx="6" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
    <circle cx="470" cy="16" r="4" fill="#8B5CF6"/>
    <text x="482" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Bezier Connections</text>

    <!-- Badge 5 -->
    <rect x="594" y="0" width="112" height="32" rx="6" fill="#1a1d24" stroke="#2e3440" stroke-width="1"/>
    <circle cx="610" cy="16" r="4" fill="#EC4899"/>
    <text x="622" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Lasso Groups</text>
  </g>
</svg>